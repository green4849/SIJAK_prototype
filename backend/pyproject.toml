[project]
name = "wipi-backend"
version = "0.1.0"
description = "시니어 6080 위피 '시작' — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.per-file-ignores]
# 자동 생성 마이그레이션은 줄 길이 검사 제외
"alembic/versions/*" = ["E501"]

# 레이어 규칙 일부를 린터로 강제 (docs/dev-order.md §2)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException".msg = "service/repository에서 HTTPException 금지 — core.errors의 도메인 예외를 쓰세요."
