# 스테이지 완료 기준(DoD)을 push·PR마다 자동 확인 — docs/dev-order.md
name: CI

on:
  # 작업 브랜치(polish/·prod/·feat/·infra/)도 병합 전에 검사
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wipi
          POSTGRES_PASSWORD: wipi
          POSTGRES_DB: wipi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wipi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wipi:wipi@localhost:5432/wipi
      TEST_DATABASE_URL: postgresql+asyncpg://wipi:wipi@localhost:5432/wipi_test
      PGPASSWORD: wipi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: psql -h localhost -U wipi -c "create database wipi_test"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:demo

  e2e:
    # 데모 빌드 대상 → 백엔드 없이 실행. 실패하면 화면 녹화(trace)가 아티팩트로 남는다
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
