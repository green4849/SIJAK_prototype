# 스테이지 완료 기준(DoD)을 push·PR마다 자동 확인 — docs/dev-order.md
name: CI

on:
  # 작업 브랜치는 PR로만 검사 — push 와 PR 이 같은 커밋을 두 번 돌리지 않게 (H40)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 PR 에 새로 push 하면 앞의 실행은 취소. main 은 배포(pages.yml)가 이 결과를 기다리므로 끝까지 돌린다
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wipi
          POSTGRES_PASSWORD: wipi
          POSTGRES_DB: wipi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wipi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wipi:wipi@localhost:5432/wipi
      TEST_DATABASE_URL: postgresql+asyncpg://wipi:wipi@localhost:5432/wipi_test
      PGPASSWORD: wipi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: psql -h localhost -U wipi -c "create database wipi_test"
      - run: uv sync
      - run: uv run ruff check .
      # 포맷도 — 로컬 완료 기준(docs/dev-order.md)과 같게. 빠져 있어서 포맷이 어긋난 파일이 main 에 들어갔었다 (H42)
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      # API 계약(OpenAPI)이 커밋된 파일과 같은지 — 백엔드만 고치고 프론트 타입 갱신을 잊으면 실패 (D3)
      - run: uv run python -m scripts.export_openapi --check
      # 시연이 복사해 둔 백엔드 값의 기준 파일이 최신인지 — 시연 사본과의 비교는 e2e/demo-constants.spec.ts (H37)
      - run: uv run python -m scripts.export_demo_constants --check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 생성 타입(schema.d.ts)이 openapi.json 과 같은지 (D3)
      - run: npm run gen:api && git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run lint
      # 단위 테스트 — 토큰 갱신·요청 재시도·메시지 합치기 같은 순수 로직 (H41)
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      # 시연 배포(pages.yml)가 쓰는 화면 주소별 사본 — App.tsx 형식이 바뀌어 주소를 못 읽으면 여기서 실패 (H35)
      - run: node scripts/pages-spa.mjs dist && test -f dist/welcome.html && test -f dist/me/index.html

  e2e:
    # 데모 빌드 대상 → 백엔드 없이 실행. 실패하면 화면 녹화(trace)가 아티팩트로 남는다
    # 2코어 러너에 1 worker 라 한 줄로 8분 걸려, 두 대에 나눠 돌린다 (H40)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 브라우저 파일은 저장해 두고 다시 씀 (Playwright 버전이 바뀌면 lock 파일이 바뀌어 새로 받음)
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7

  deploy-smoke:
    # 운영 구성(B10)을 그대로 띄워 확인 — 이미지 빌드, 마이그레이션 자동 적용, HTTPS, /api 프록시, SPA 주소
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 시험용 운영 환경값 (비밀값은 매번 새로 생성)
        run: |
          cp infra/.env.prod.example infra/.env.prod
          sh infra/gen-secrets.sh >> infra/.env.prod
          sed -i 's/^DOMAIN=.*/DOMAIN=localhost/; s/^ALLOW_MOCK_IDENTITY_IN_PROD=.*/ALLOW_MOCK_IDENTITY_IN_PROD=true/' infra/.env.prod
      - name: 띄우기
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build --wait --wait-timeout 180
      - name: 확인
        run: |
          set -e
          c() { curl -sk --retry 10 --retry-delay 2 --retry-all-errors "$@"; }
          c -f https://localhost/api/v1/health | grep -q '"ok"'
          c -f https://localhost/ | grep -q 'id="root"'
          c -f https://localhost/friends | grep -q 'id="root"'          # 화면 주소 → index.html
          test "$(c -o /dev/null -w '%{http_code}' https://localhost/api/v1/me)" = 401
          c -I https://localhost/sw.js | grep -qi 'cache-control: no-cache'
          c -I https://localhost/ | grep -qi '^content-security-policy:.*frame-ancestors'   # H42
          c -sI http://localhost/ | grep -qi '^location: https://'       # http → https
          # 운영 안전장치(B1): 기본 비밀값이면 API가 뜨지 않아야 한다
          ! docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod run --rm --no-deps \
              --entrypoint python -e 'JWT_SECRET=change-me-local-only-32bytes-minimum!!' api -c "from app.main import app"
      - if: failure()
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod logs --no-color | tail -200
