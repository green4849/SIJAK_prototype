# 스테이지 완료 기준(DoD)을 push·PR마다 자동 확인 — docs/dev-order.md
name: CI

on:
  # 작업 브랜치(polish/·prod/·feat/·infra/)도 병합 전에 검사
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wipi
          POSTGRES_PASSWORD: wipi
          POSTGRES_DB: wipi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wipi" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wipi:wipi@localhost:5432/wipi
      TEST_DATABASE_URL: postgresql+asyncpg://wipi:wipi@localhost:5432/wipi_test
      PGPASSWORD: wipi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: psql -h localhost -U wipi -c "create database wipi_test"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      # API 계약(OpenAPI)이 커밋된 파일과 같은지 — 백엔드만 고치고 프론트 타입 갱신을 잊으면 실패 (D3)
      - run: uv run python -m scripts.export_openapi --check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # 생성 타입(schema.d.ts)이 openapi.json 과 같은지 (D3)
      - run: npm run gen:api && git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run lint
      - run: npm run build
      - run: npm run build:demo

  e2e:
    # 데모 빌드 대상 → 백엔드 없이 실행. 실패하면 화면 녹화(trace)가 아티팩트로 남는다
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  deploy-smoke:
    # 운영 구성(B10)을 그대로 띄워 확인 — 이미지 빌드, 마이그레이션 자동 적용, HTTPS, /api 프록시, SPA 주소
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시험용 운영 환경값 (비밀값은 매번 새로 생성)
        run: |
          cp infra/.env.prod.example infra/.env.prod
          sh infra/gen-secrets.sh >> infra/.env.prod
          sed -i 's/^DOMAIN=.*/DOMAIN=localhost/; s/^ALLOW_MOCK_IDENTITY_IN_PROD=.*/ALLOW_MOCK_IDENTITY_IN_PROD=true/' infra/.env.prod
      - name: 띄우기
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build --wait --wait-timeout 180
      - name: 확인
        run: |
          set -e
          c() { curl -sk --retry 10 --retry-delay 2 --retry-all-errors "$@"; }
          c -f https://localhost/api/v1/health | grep -q '"ok"'
          c -f https://localhost/ | grep -q 'id="root"'
          c -f https://localhost/friends | grep -q 'id="root"'          # 화면 주소 → index.html
          test "$(c -o /dev/null -w '%{http_code}' https://localhost/api/v1/me)" = 401
          c -I https://localhost/sw.js | grep -qi 'cache-control: no-cache'
          c -sI http://localhost/ | grep -qi '^location: https://'       # http → https
          # 운영 안전장치(B1): 기본 비밀값이면 API가 뜨지 않아야 한다
          ! docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod run --rm --no-deps \
              --entrypoint python -e 'JWT_SECRET=change-me-local-only-32bytes-minimum!!' api -c "from app.main import app"
      - if: failure()
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod logs --no-color | tail -200
