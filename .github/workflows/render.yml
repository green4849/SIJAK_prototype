# 운영 서버(Render) 배포 — main 의 CI 가 성공하면 Deploy Hook 으로 두 서비스를 다시 배포한다.
#
# 예전에는 Render 의 autoDeployTrigger: checksPass 에 맡겼다. 그런데 커밋마다 다른 GitHub 앱의
# 검사 묶음(실행 0개, 'queued' 그대로)이 붙어 '모든 검사 통과'가 끝나지 않아 자동 배포가 한 번도
# 일어나지 않았다. 그래서 render.yaml 은 autoDeployTrigger: off, 배포 시점은 여기서 정한다.
#
# Deploy Hook 은 서비스가 따라가는 브랜치(main)의 '최신 커밋'을 배포한다. CI 가 검사한 커밋과
# 같게 하려고, 그 커밋이 아직 main 의 최신일 때만 부른다. 그사이 main 이 앞서 나갔으면 건너뛴다 —
# 더 새 커밋의 CI 가 끝나면 이 워크플로가 다시 돈다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions) — docs/deploy-render.md
#   RENDER_DEPLOY_HOOK_API : sijak-6080-api 의 Deploy Hook 주소
#   RENDER_DEPLOY_HOOK_WEB : sijak-6080     의 Deploy Hook 주소
# Hook 주소는 그 자체가 비밀값(아는 사람은 누구나 배포를 시작할 수 있음) — 로그에 찍지 않는다.
name: Deploy to Render

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 손으로 돌리면 지금 main 의 최신 커밋을 배포 (CI 결과는 확인하지 않음)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: CI 가 검사한 커밋이 아직 main 의 최신인지
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$head" != "$TESTED" ]; then
            echo "::notice::main 이 ${TESTED::7} → ${head::7} 로 앞서 나가 건너뜀. 새 커밋의 CI 가 끝나면 다시 배포한다."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Hook 호출
        if: steps.latest.outputs.go == 'true'
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_WEB" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_API·RENDER_DEPLOY_HOOK_WEB Secrets 가 없어 Render 배포를 건너뜀 (docs/deploy-render.md '업데이트')"
            exit 0
          fi
          fail=0
          for name in api web; do
            if [ "$name" = api ]; then url="$HOOK_API"; else url="$HOOK_WEB"; fi
            # 주소는 찍지 않고 상태 코드만 — 응답 본문도 버린다
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --retry 3 --retry-all-errors --max-time 30 "$url" || echo 000)
            echo "$name: HTTP $code"
            case "$code" in 2*) ;; *) fail=1 ;; esac
          done
          [ "$fail" = 0 ] || { echo "::error::Deploy Hook 호출 실패 — Render 대시보드 Events 와 Secrets 의 주소를 확인"; exit 1; }

      - name: 백엔드가 다시 뜰 때까지 (최대 15분)
        if: steps.latest.outputs.go == 'true'
        env:
          HAS_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOK_API != '' }}
        run: |
          [ "$HAS_HOOKS" = true ] || exit 0
          # 무료 플랜은 빌드 5~10분 + 잠든 서버 깨우기. 상태 확인만 — 새 버전인지는 Render Events 에서
          sleep 60
          for i in $(seq 1 28); do
            if curl -sf --max-time 60 https://sijak-6080-api.onrender.com/api/v1/health >/dev/null; then
              echo "API 응답 정상"; exit 0
            fi
            sleep 30
          done
          echo "::warning::15분 안에 API 가 응답하지 않음 — Render 대시보드 → sijak-6080-api → Events·Logs 확인"
