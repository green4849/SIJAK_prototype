# 준비된 예약 작업 통로. 운영 DB 연결은 저장소 변수 ENABLE_PRODUCTION_JOBS=true를
# 명시적으로 설정하기 전까지 실행하지 않는다. 필요한 비밀값은 docs/deploy-render.md 참조.
name: Production maintenance

on:
  schedule:
    - cron: "0 19 * * *" # 한국 시각 매일 04:00 — 탈퇴 계정·음성 기록·관계 지수
    - cron: "*/10 * * * *" # 못 보낸 긴급 도움 문자 재시도
    - cron: "0 0 * * *" # 한국 시각 09:00 — 아침 추천
    - cron: "0 4 * * *" # 한국 시각 13:00 — 점심 추천
    - cron: "0 10 * * *" # 한국 시각 19:00 — 저녁 추천
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업"
        required: true
        default: daily
        type: choice
        options: [daily, sos-retry, recommend-morning, recommend-noon, recommend-evening]

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    # 승인 전에는 예약·수동 실행 모두 운영 DB에 접속하지 않는다.
    if: vars.ENABLE_PRODUCTION_JOBS == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENV: prod
      DATABASE_URL: ${{ secrets.JOBS_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JOBS_JWT_SECRET }}
      DATA_ENCRYPTION_KEY: ${{ secrets.JOBS_DATA_ENCRYPTION_KEY }}
      PHONE_HASH_PEPPER: ${{ secrets.JOBS_PHONE_HASH_PEPPER }}
      CORS_ORIGINS: '["https://sijak-6080.onrender.com"]'
      AUTH_MODE: kakao
      KAKAO_REST_API_KEY: ${{ secrets.JOBS_KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.JOBS_KAKAO_CLIENT_SECRET }}
      KAKAO_REDIRECT_URI: https://sijak-6080.onrender.com/login/kakao/callback
      IDENTITY_PROVIDER: mock
      ALLOW_MOCK_IDENTITY_IN_PROD: 'false'
      SMS_PROVIDER: ${{ vars.JOBS_SMS_PROVIDER || 'off' }}
      SOLAPI_API_KEY: ${{ secrets.JOBS_SOLAPI_API_KEY }}
      SOLAPI_API_SECRET: ${{ secrets.JOBS_SOLAPI_API_SECRET }}
      SMS_SENDER_NUMBER: ${{ secrets.JOBS_SMS_SENDER_NUMBER }}
      MEDIA_STORAGE: local
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: 필수 환경값 확인
        run: |
          for key in DATABASE_URL JWT_SECRET DATA_ENCRYPTION_KEY PHONE_HASH_PEPPER KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET; do
            if [ -z "${!key}" ]; then
              echo "::error::$key Secret 이 비어 있습니다"
              exit 1
            fi
          done
          if [ "$SMS_PROVIDER" = solapi ]; then
            for key in SOLAPI_API_KEY SOLAPI_API_SECRET SMS_SENDER_NUMBER; do
              if [ -z "${!key}" ]; then
                echo "::error::$key Secret 이 비어 있습니다"
                exit 1
              fi
            done
          fi
      - run: uv sync --no-dev
      - name: 예약 작업 실행
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            task="$MANUAL_TASK"
          else
            case "$SCHEDULE" in
              '0 19 * * *') task=daily ;;
              '0 0 * * *') task=recommend-morning ;;
              '0 4 * * *') task=recommend-noon ;;
              '0 10 * * *') task=recommend-evening ;;
              *) task=sos-retry ;;
            esac
          fi
          case "$task" in
            daily) set -- daily ;;
            sos-retry)
              if [ "$SMS_PROVIDER" = off ]; then
                echo "문자 공급자가 꺼져 있어 재시도를 건너뜀"
                exit 0
              fi
              set -- sos-retry ;;
            recommend-morning) set -- recommend morning ;;
            recommend-noon) set -- recommend noon ;;
            recommend-evening) set -- recommend evening ;;
            *) echo "::error::알 수 없는 작업"; exit 2 ;;
          esac
          uv run --no-dev python -m scripts.jobs "$@"
