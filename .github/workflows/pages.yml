# 데모(서버 없음)를 GitHub Pages에 자동 배포 — main에 push하면 갱신
# 주소: https://<계정>.github.io/<저장소명>/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build demo
        run: npm run build:demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 공유 미리보기(og:image·og:url)는 절대 주소여야 한다 (H35)
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # SPA: 새로고침·직접 링크(/저장소/friends 등)도 HTTP 200 으로 — 화면 주소마다 index.html 사본, 나머지는 404.html
      - run: node scripts/pages-spa.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
