# Render 무료 배포 (시범 운영) — 백엔드(Docker 웹 서비스) + 화면(정적 사이트), DB는 Neon 무료.
# 순서와 주의할 점: docs/deploy-render.md
#
#   화면  https://sijak-6080.onrender.com        (정적 사이트, CDN)
#           └ /api/* 를 아래 백엔드로 넘김(rewrite) → 브라우저 입장에서는 같은 주소라 쿠키·CORS 문제가 없다
#   API   https://sijak-6080-api.onrender.com    (FastAPI, 시작할 때 alembic upgrade head)
#   DB    Neon (DATABASE_URL — Blueprint 만들 때 직접 붙여 넣음)
#
# 서비스 이름이 이미 쓰이고 있으면 Render 가 주소 뒤에 글자를 붙인다.
# 그때는 아래 세 곳(CORS_ORIGINS·VITE_SITE_URL·rewrite destination)을 실제 주소로 고친다.

services:
  - type: web
    name: sijak-6080-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # main 의 CI 가 통과한 커밋만 배포 (시연 사이트와 같은 규칙)
    autoDeployTrigger: checksPass
    envVars:
      # 이미지의 uvicorn 은 8000 에서 듣는다 (Render 기본은 10000)
      - key: PORT
        value: "8000"
      # Neon 의 'Connection string'(pooled 아님, Direct) 을 그대로 붙여 넣는다.
      # postgresql://…?sslmode=require&channel_binding=require 모양이어도 config.py 가 asyncpg 용으로 바꾼다
      - key: DATABASE_URL
        sync: false
      # 비밀값 — Render 가 무작위로 만든다(base64 256비트). DATA_ENCRYPTION_KEY 는 그 자체로 32바이트 키가 된다.
      # 잃으면 저장된 전화번호를 풀 수 없으니 Render 화면에서 값을 복사해 안전한 곳에 따로 보관 (B12)
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://sijak-6080.onrender.com"]'
      # 실제 본인인증 계약 전 시범 운영 — 누구나 화면에 뜬 번호로 가입할 수 있다
      - key: IDENTITY_PROVIDER
        value: mock
      - key: ALLOW_MOCK_IDENTITY_IN_PROD
        value: "true"
      - key: MIN_SIGNUP_AGE
        value: "60"

  - type: web
    name: sijak-6080
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE
        value: /
      # 공유 미리보기(og:image)를 절대 주소로
      - key: VITE_SITE_URL
        value: https://sijak-6080.onrender.com/
    routes:
      # 위에서부터. 실제 파일이 있는 주소에는 적용되지 않는다
      - type: rewrite
        source: /api/*
        destination: https://sijak-6080-api.onrender.com/api/*
      # 화면 주소(SPA)는 모두 index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # infra/Caddyfile 과 같은 보안 헤더 (CSP 는 frontend/e2e/csp.spec.ts 가 Caddyfile 기준으로 검사)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), microphone=(self), camera=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: https://nominatim.openstreetmap.org https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      # 캐시: 앱 껍데기(index.html·sw.js·manifest)는 매번 확인 → 배포 즉시 반영, 해시 이름 파일은 1년
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
