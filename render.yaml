# Render 무료 배포 (시범 운영) — 백엔드(Docker 웹 서비스) + 화면(정적 사이트), DB는 Neon 무료.
# 순서와 주의할 점: docs/deploy-render.md
#
#   화면  https://sijak-6080.onrender.com        (정적 사이트, CDN)
#           └ /api/* 를 아래 백엔드로 넘김(rewrite) → 브라우저 입장에서는 같은 주소라 쿠키·CORS 문제가 없다
#   API   https://sijak-6080-api.onrender.com    (FastAPI, 시작할 때 alembic upgrade head)
#   DB    Neon (DATABASE_URL — Blueprint 만들 때 직접 붙여 넣음)
#
# 서비스 이름이 이미 쓰이고 있으면 Render 가 주소 뒤에 글자를 붙인다.
# 그때는 아래 세 곳(CORS_ORIGINS·VITE_SITE_URL·rewrite destination)을 실제 주소로 고친다.

services:
  - type: web
    name: sijak-6080-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # 자동 배포는 끔 — main 의 CI 가 성공하면 .github/workflows/render.yml 이 Deploy Hook 으로 배포한다
    autoDeployTrigger: "off"
    envVars:
      # 이미지의 uvicorn 은 8000 에서 듣는다 (Render 기본은 10000)
      - key: PORT
        value: "8000"
      # Neon 의 'Connection string'(pooled 아님, Direct) 을 그대로 붙여 넣는다.
      # postgresql://…?sslmode=require&channel_binding=require 모양이어도 config.py 가 asyncpg 용으로 바꾼다
      - key: DATABASE_URL
        sync: false
      # 비밀값 — Render 가 무작위로 만든다(base64 256비트). DATA_ENCRYPTION_KEY 는 그 자체로 32바이트 키가 된다.
      # 잃으면 저장된 전화번호를 풀 수 없으니 Render 화면에서 값을 복사해 안전한 곳에 따로 보관 (B12)
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://sijak-6080.onrender.com"]'
      # 휴대폰 인증. mock = 화면에 번호가 떠서 누구나 가입할 수 있다(시범 운영 전용).
      # Firebase 전화 인증(실제 문자)으로 바꾸는 순서: docs/deploy-render.md 「휴대폰 인증 문자 켜기」
      #   → 아래 FIREBASE_* 세 값을 Render 화면에 넣은 뒤 IDENTITY_PROVIDER=firebase, ALLOW_MOCK…=false
      - key: IDENTITY_PROVIDER
        value: mock
      - key: ALLOW_MOCK_IDENTITY_IN_PROD
        value: "true"
      # Firebase 웹 설정값 — 비밀은 아니지만 저장소가 공개라 Render 화면에만 넣는다
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: MIN_SIGNUP_AGE
        value: "60"
      # 긴급 도움 → 보호자 문자 (C10). off = 기록만(화면도 그렇게 말함). 켜는 순서: docs/deploy-render.md 「긴급 도움 문자 켜기」
      #   → 아래 세 값을 Render 화면에 넣은 뒤 SMS_PROVIDER=solapi
      - key: SMS_PROVIDER
        value: "off"
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SMS_SENDER_NUMBER
        sync: false
      # 휴대폰 알림 Web Push (C4). 두 키가 없으면 알림함에만 쌓인다. 켜는 순서: docs/deploy-render.md 「휴대폰 알림 켜기」
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: https://sijak-6080.onrender.com

  - type: web
    name: sijak-6080
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # 자동 배포는 끔 — main 의 CI 가 성공하면 .github/workflows/render.yml 이 Deploy Hook 으로 배포한다
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_BASE
        value: /
      # 공유 미리보기(og:image)를 절대 주소로
      - key: VITE_SITE_URL
        value: https://sijak-6080.onrender.com/
    routes:
      # 위에서부터. 실제 파일이 있는 주소에는 적용되지 않는다
      - type: rewrite
        source: /api/*
        destination: https://sijak-6080-api.onrender.com/api/*
      # 화면 주소(SPA)는 모두 index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # infra/Caddyfile 과 같은 보안 헤더 (CSP 는 frontend/e2e/csp.spec.ts 가 Caddyfile 기준으로 검사)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), microphone=(self), camera=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: https://nominatim.openstreetmap.org https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google.com/recaptcha/ https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      # 캐시: 앱 껍데기(index.html·sw.js·manifest)는 매번 확인 → 배포 즉시 반영, 해시 이름 파일은 1년
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
